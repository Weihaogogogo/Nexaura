<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Token Debug</title>
    <style>
        body {
            font-family: monospace;
            margin: 20px;
            background: #f5f5f5;
        }
        .section {
            background: white;
            padding: 15px;
            margin: 10px 0;
            border-radius: 5px;
            border-left: 4px solid #007cba;
        }
        .token {
            word-break: break-all;
            background: #f8f8f8;
            padding: 10px;
            border-radius: 3px;
            margin: 5px 0;
        }
        .error {
            color: red;
            font-weight: bold;
        }
        .success {
            color: green;
            font-weight: bold;
        }
        .warning {
            color: orange;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>🔍 JWT Token 诊断工具</h1>
    
    <div class="section">
        <h2>1. LocalStorage Token检查</h2>
        <div id="tokenStatus"></div>
    </div>
    
    <div class="section">
        <h2>2. Token解析</h2>
        <div id="tokenPayload"></div>
    </div>
    
    <div class="section">
        <h2>3. 用户数据检查</h2>
        <div id="userData"></div>
    </div>
    
    <div class="section">
        <h2>4. API测试</h2>
        <button onclick="testWorkflowAPI()">测试工作流API</button>
        <div id="apiResult"></div>
    </div>

    <script>
        // 检查localStorage中的token
        function checkToken() {
            const tokenElement = document.getElementById('tokenStatus');
            const payloadElement = document.getElementById('tokenPayload');
            const userElement = document.getElementById('userData');
            
            const token = localStorage.getItem('auth_token');
            const refreshToken = localStorage.getItem('refresh_token');
            const user = localStorage.getItem('user');
            
            if (!token) {
                tokenElement.innerHTML = '<span class="error">❌ 没有找到access token</span>';
                return;
            }
            
            tokenElement.innerHTML = `
                <span class="success">✅ Access Token存在</span><br>
                <div class="token">Token: ${token.substring(0, 50)}...</div>
                ${refreshToken ? `<span class="success">✅ Refresh Token存在</span>` : '<span class="warning">⚠️ 没有Refresh Token</span>'}
            `;
            
            // 解析token
            try {
                const parts = token.split('.');
                if (parts.length !== 3) {
                    throw new Error('Invalid JWT format');
                }
                
                const payload = JSON.parse(atob(parts[1]));
                const currentTime = Date.now() / 1000;
                const isExpired = payload.exp < currentTime;
                const timeUntilExpiry = payload.exp - currentTime;
                
                payloadElement.innerHTML = `
                    <strong>Token Payload:</strong><br>
                    • 用户: ${payload.sub || 'N/A'}<br>
                    • 过期时间: ${new Date(payload.exp * 1000).toLocaleString()}<br>
                    • 当前时间: ${new Date().toLocaleString()}<br>
                    • 状态: ${isExpired ? '<span class="error">❌ 已过期</span>' : '<span class="success">✅ 有效</span>'}<br>
                    • 剩余时间: ${Math.round(timeUntilExpiry)} 秒 (${Math.round(timeUntilExpiry/60)} 分钟)<br>
                    • Token类型: ${payload.type || 'N/A'}
                `;
            } catch (error) {
                payloadElement.innerHTML = `<span class="error">❌ Token解析失败: ${error.message}</span>`;
            }
            
            // 检查用户数据
            if (user) {
                try {
                    const userData = JSON.parse(user);
                    userElement.innerHTML = `
                        <span class="success">✅ 用户数据存在</span><br>
                        • 邮箱: ${userData.email}<br>
                        • 姓名: ${userData.name || 'N/A'}<br>
                        • 额度: ${userData.used_quota}/${userData.total_quota}
                    `;
                } catch (error) {
                    userElement.innerHTML = `<span class="error">❌ 用户数据解析失败: ${error.message}</span>`;
                }
            } else {
                userElement.innerHTML = '<span class="error">❌ 没有找到用户数据</span>';
            }
        }
        
        // 测试工作流API
        async function testWorkflowAPI() {
            const resultElement = document.getElementById('apiResult');
            resultElement.innerHTML = '🔄 测试中...';
            
            const token = localStorage.getItem('auth_token');
            if (!token) {
                resultElement.innerHTML = '<span class="error">❌ 没有token，无法测试</span>';
                return;
            }
            
            try {
                const response = await fetch('/workflows/list', {
                    method: 'GET',
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultElement.innerHTML = `
                        <span class="success">✅ API调用成功</span><br>
                        <div class="token">${JSON.stringify(data, null, 2)}</div>
                    `;
                } else {
                    resultElement.innerHTML = `
                        <span class="error">❌ API调用失败 (${response.status})</span><br>
                        <div class="token">${JSON.stringify(data, null, 2)}</div>
                    `;
                }
            } catch (error) {
                resultElement.innerHTML = `<span class="error">❌ 网络错误: ${error.message}</span>`;
            }
        }
        
        // 页面加载时执行检查
        window.onload = checkToken;
    </script>
</body>
</html>
